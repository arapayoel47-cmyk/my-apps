<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Mi Horario Yovel</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,sans-serif}header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px}h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:#d1d5db}.days{display:flex;gap:8px;overflow:auto;padding:18px 14px 8px;scrollbar-width:none}.day{border:0;border-radius:15px;background:#fff;padding:10px 14px;font-weight:700;color:#4b5563}.day.active{background:#111827;color:white}.wrap{padding:8px 14px 100px}.empty{text-align:center;color:#6b7280;padding:70px 20px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;display:grid;grid-template-columns:7px 1fr auto;gap:13px;box-shadow:0 5px 18px #1118270d}.bar{border-radius:8px}.time{font-size:13px;color:#6b7280}.title{font-size:17px;font-weight:750;margin-top:2px}.note{font-size:13px;color:#6b7280;margin-top:4px}.delete{border:0;background:#fee2e2;color:#b91c1c;border-radius:12px;padding:8px 10px;align-self:center}.add{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:20px;background:#111827;color:#fff;font-size:34px;box-shadow:0 10px 25px #11182755}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 16px}label{display:block;font-size:13px;font-weight:700;color:#4b5563;margin:11px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:19px}.actions button{flex:1;padding:13px;border:0;border-radius:13px;font-weight:750}.cancel{background:#e5e7eb}.save{background:#111827;color:#fff}
</style></head><body><header><h1>Mi Horario Yovel</h1><p>Organiza tu semana a tu manera</p></header><nav class="days" id="days"></nav><main class="wrap" id="list"></main><button class="add" id="add" aria-label="Agregar">+</button><div class="modal" id="modal"><form class="sheet" id="form"><h2>Nueva actividad</h2><label>Día</label><select id="fday"></select><label>Actividad</label><input id="title" required maxlength="50" placeholder="Ej. Instituto, gimnasio o trabajo"><div class="row"><div><label>Inicio</label><input id="start" type="time" required></div><div><label>Fin</label><input id="end" type="time" required></div></div><label>Nota (opcional)</label><input id="note" maxlength="80" placeholder="Aula, lugar o detalle"><label>Color</label><input id="color" type="color" value="#6366f1"><div class="actions"><button type="button" class="cancel" id="cancel">Cancelar</button><button class="save">Guardar</button></div></form></div><script>
const names=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];let selected=Math.max(0,new Date().getDay()-1);let items=JSON.parse(localStorage.getItem('horario-yovel')||'[]');const days=document.querySelector('#days'),list=document.querySelector('#list'),modal=document.querySelector('#modal'),fday=document.querySelector('#fday');
names.forEach((n,i)=>{days.innerHTML+=`<button class="day" data-i="${i}">${n.slice(0,3)}</button>`;fday.innerHTML+=`<option value="${i}">${n}</option>`});
function render(){document.querySelectorAll('.day').forEach((b,i)=>b.classList.toggle('active',i===selected));const today=items.filter(x=>+x.day===selected).sort((a,b)=>a.start.localeCompare(b.start));list.innerHTML=today.length?today.map(x=>`<article class="card"><div class="bar" style="background:${x.color}"></div><div><div class="time">${x.start} – ${x.end}</div><div class="title">${esc(x.title)}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div><button class="delete" data-id="${x.id}">Eliminar</button></article>`).join(''):`<div class="empty"><div style="font-size:45px">📅</div><h3>Tu día está libre</h3><p>Pulsa + para agregar una actividad.</p></div>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('horario-yovel',JSON.stringify(items));render()}
days.onclick=e=>{if(e.target.dataset.i!=null){selected=+e.target.dataset.i;render()}};document.querySelector('#add').onclick=()=>{fday.value=selected;modal.classList.add('show')};document.querySelector('#cancel').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};list.onclick=e=>{const id=e.target.dataset.id;if(id&&confirm('¿Eliminar esta actividad?')){items=items.filter(x=>x.id!==id);save()}};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const start=document.querySelector('#start').value,end=document.querySelector('#end').value;if(end<=start)return alert('La hora final debe ser posterior a la inicial.');items.push({id:crypto.randomUUID(),day:fday.value,title:document.querySelector('#title').value.trim(),start,end,note:document.querySelector('#note').value.trim(),color:document.querySelector('#color').value});save();e.target.reset();document.querySelector('#color').value='#6366f1';modal.classList.remove('show')};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
